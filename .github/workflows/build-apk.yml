name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          NDK_VER="26.1.10909125"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK/cmdline-tools"
          curl -sSLo tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          if [ -d cmdline-tools ]; then mv cmdline-tools latest; fi
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-29" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VER"
          NDKBIN="$SDK/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            for tool in ar ranlib readelf objcopy strip nm objdump; do
              ln -sf "llvm-$tool" "$NDKBIN/$t-$tool"
            done
            ln -sf ld.lld "$NDKBIN/$t-ld"
          done
          LW_A=$(find "$SDK/ndk/$NDK_VER" -name 'libunwind.a' -path '*/linux/aarch64/*' 2>/dev/null | head -1)
          LW_R=$(find "$SDK/ndk/$NDK_VER" -name 'libunwind.a' -path '*/linux/arm/*' 2>/dev/null | head -1)
          echo "aarch64 libunwind: $LW_A"
          echo "arm libunwind: $LW_R"
          FLAGS=""
          if [ -n "$LW_A" ]; then FLAGS="$FLAGS -C link-arg=-L$(dirname "$LW_A")"; fi
          if [ -n "$LW_R" ]; then FLAGS="$FLAGS -C link-arg=-L$(dirname "$LW_R")"; fi
          echo "RUSTFLAGS=$FLAGS" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/$NDK_VER" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install cargo-quad-apk
        run: cargo install cargo-quad-apk

      - name: Build APK
        run: |
          set -o pipefail
          cargo quad-apk build --release 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flappy-rs-apk
          path: target/android-artifacts/release/apk/*.apk
          if-no-files-found: error
          retention-days: 30
